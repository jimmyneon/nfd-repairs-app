name: Quote and payment journey
on:
  pull_request:
    paths: ['app/api/**', 'lib/**', 'components/RepairPayments.tsx', 'tests/**', 'supabase/migrations/**', 'package*.json', '.github/workflows/quote-payment-journey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NFD_SITE_TEST_ROOT: tests/fixtures/customer-site
      DISABLE_CUSTOMER_MESSAGES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run tests/payment-ledger.test.ts tests/quote-pricing.test.ts tests/payment-checkout.test.ts tests/payment-reconciliation.test.ts tests/enquiry-phone-conversion.test.ts tests/public-quote-options.test.ts tests/public-route-security.test.ts tests/customer-pages.test.ts
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
        run: npm run build
