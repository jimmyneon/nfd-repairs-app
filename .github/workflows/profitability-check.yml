name: Profitability validation

on:
  pull_request:
    paths:
      - 'app/api/profitability/**'
      - 'app/app/profitability/**'
      - 'app/app/jobs/page.tsx'
      - 'app/app/notifications/page.tsx'
      - 'components/NavDropdown.tsx'
      - 'lib/profitability.ts'
      - 'tests/profitability.test.ts'
      - 'supabase/migrations/*profitability*'
      - 'vercel.json'
      - '.github/workflows/profitability-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run profitability tests
        run: npx vitest run tests/profitability.test.ts

      - name: Type-check changes
        run: npx tsc --noEmit
