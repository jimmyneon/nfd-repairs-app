name: Repair flow validation

on:
  push:
    branches:
      - main
    paths:
      - 'app/api/email/**'
      - 'app/api/enquiries/**'
      - 'app/api/analytics/quote-ux/**'
      - 'app/api/jobs/**'
      - 'app/api/password/**'
      - 'app/api/sms/**'
      - 'app/api/public/**'
      - 'app/quote/**'
      - 'app/api/tracking/**'
      - 'app/app/enquiries/**'
      - 'app/app/analytics/quote-ux/**'
      - 'app/app/jobs/**'
      - 'app/f/**'
      - 'app/t/**'
      - 'app/walk-in/complete/**'
      - 'lib/constants.ts'
      - 'lib/email-templates-embedded.ts'
      - 'lib/utils.ts'
      - 'lib/types-v3.ts'
      - 'lib/awaiting-device-followup.ts'
      - 'lib/public-quote-options.ts'
      - 'vercel.json'
      - 'supabase/migrations/**'
      - 'tests/fast-dropoff.test.ts'
      - 'tests/awaiting-device-followup.test.ts'
      - 'tests/public-quote-options.test.ts'
      - '.github/workflows/repair-flow-check.yml'
  pull_request:
    paths:
      - 'app/api/email/**'
      - 'app/api/enquiries/**'
      - 'app/api/analytics/quote-ux/**'
      - 'app/api/jobs/**'
      - 'app/api/password/**'
      - 'app/api/sms/**'
      - 'app/api/public/**'
      - 'app/quote/**'
      - 'app/api/tracking/**'
      - 'app/app/enquiries/**'
      - 'app/app/analytics/quote-ux/**'
      - 'app/app/jobs/**'
      - 'app/f/**'
      - 'app/t/**'
      - 'app/walk-in/complete/**'
      - 'lib/constants.ts'
      - 'lib/email-templates-embedded.ts'
      - 'lib/utils.ts'
      - 'lib/types-v3.ts'
      - 'lib/awaiting-device-followup.ts'
      - 'lib/public-quote-options.ts'
      - 'vercel.json'
      - 'supabase/migrations/**'
      - 'tests/fast-dropoff.test.ts'
      - 'tests/awaiting-device-followup.test.ts'
      - 'tests/public-quote-options.test.ts'
      - '.github/workflows/repair-flow-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repair-flow tests
        run: npx vitest run tests/fast-dropoff.test.ts tests/enquiry-phone-conversion.test.ts tests/awaiting-device-followup.test.ts

      - name: Verify progressive quote commitment safeguards
        run: |
          grep -Fq "case 'set_dropoff_intent'" app/api/enquiries/update/route.ts
          grep -Fq "['today', 'tomorrow']" app/api/enquiries/update/route.ts
          grep -Fq "Drop-off intent is only available after a repair request is accepted." app/api/enquiries/update/route.ts
          grep -Fq "const acknowledgement = { sms: false, email: false }" app/api/enquiries/submit/route.ts
          grep -Fq "REPAIR_REQUEST_RECEIVED" app/api/enquiries/submit/route.ts
          grep -Fq "await sendSms" app/api/enquiries/submit/route.ts
          grep -Fq "await sendEmail" app/api/enquiries/submit/route.ts
          grep -Fq "post_capture_timing_selected" app/api/analytics/quote-ux/route.ts
          grep -Fq "Timing supplied after capture" app/app/analytics/quote-ux/page.tsx
          grep -Fq "LEGACY_QUOTE_APPROVAL_RETIRED" app/api/enquiries/update/route.ts
          grep -Fq "awaiting_device_followup_at" app/api/jobs/send-awaiting-device-followups/route.ts
          grep -Fq "AWAITING_DEVICE_FOLLOWUP" app/api/jobs/send-awaiting-device-followups/route.ts
          grep -Fq "isAwaitingDeviceFollowupDue" app/api/jobs/send-awaiting-device-followups/route.ts
          grep -Fq "/api/jobs/send-awaiting-device-followups" vercel.json
          grep -Fq "Awaiting device" app/app/jobs/page.tsx
          grep -Fq "Overdue / followed up" app/app/jobs/page.tsx
          grep -Fq "available_addons" "app/api/public/quote/[ref]/route.ts"
          grep -Fq "customer_update: buildCustomerUpdate(linkedJob)" "app/api/public/quote/[ref]/route.ts"
          grep -Fq "Save selected extras" "app/quote/approve/[jobId]/page.tsx"
          grep -Fq "What happens next" "app/quote/approve/[jobId]/page.tsx"
          grep -Fq "parts_expected_at: requiresParts && earliest_date" app/api/enquiries/convert-to-job/route.ts
          grep -Fq "converted_job_id" "app/api/public/quote/[ref]/options/route.ts"

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
        run: npm run build
